name: Build

# Every Branch Push And Pull Request Builds, Releases Are Made By Hand
on:
  push:
    branches:
      - "**"
  pull_request:

# A Newer Push Replaces A Run Still Going On The Same Branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      # The Pinned FFmpeg Is Fetched And Hash Checked, Never Committed
      - name: Fetch FFmpeg
        run: ./LetsClip.Desktop/FFmpeg/Get-FFmpeg.ps1

      - name: Build
        run: dotnet build LetsClip.slnx -c Release -warnaserror

      # The Messages Visual Studio Lists, Which A Build Never Prints
      - name: Check Analyzers And Style
        run: |
          foreach ($project in Get-ChildItem -Recurse -Filter *.csproj) {
            dotnet format analyzers $project.FullName --verify-no-changes --severity info
            if ($LASTEXITCODE) { exit 1 }
            dotnet format style $project.FullName --verify-no-changes --severity info
            if ($LASTEXITCODE) { exit 1 }
          }

      # The Same CSharpier As On The Owner's PC
      - name: Check Formatting
        run: |
          dotnet tool install --global csharpier --version 1.3.0
          csharpier check .

name: Build

# Every Branch Push And Pull Request Builds, Releases Are Made By Hand
on:
  push:
    branches:
      - "**"
  pull_request:

# A Newer Push Replaces A Run Still Going On The Same Branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The Pinned FFmpeg Is Fetched And Hash Checked, Never Committed
      - name: Fetch FFmpeg
        run: ./LetsClip.Desktop/FFmpeg/Get-FFmpeg.ps1

      - name: Build
        run: dotnet build LetsClip.slnx -c Release